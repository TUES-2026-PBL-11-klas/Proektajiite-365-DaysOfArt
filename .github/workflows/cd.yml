name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Kubernetes
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images built by CI
        run: |
          docker pull ghcr.io/tues-2026-pbl-11-klas/365-days-of-art-backend:${{ github.event.workflow_run.head_sha }}
          docker pull ghcr.io/tues-2026-pbl-11-klas/365-days-of-art-frontend:${{ github.event.workflow_run.head_sha }}

      - name: Sync secrets to cluster
        run: |
          kubectl create namespace days-of-art --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic backend-secrets \
            --from-literal=database-url="${{ secrets.DATABASE_URL }}" \
            --from-literal=jwt-secret-key="${{ secrets.JWT_SECRET_KEY }}" \
            --namespace days-of-art \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply static resources
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend-configmap.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-configmap.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy with Helm
        run: |
          helm upgrade --install 365-days-of-art ./helm/365-days-of-art \
            --namespace days-of-art \
            --set "backend.image.tag=${{ github.event.workflow_run.head_sha }}" \
            --set "frontend.image.tag=${{ github.event.workflow_run.head_sha }}" \
            --wait --timeout 5m

      - name: Notify success
        if: success()
        run: |
          [ -n "${{ secrets.WEBHOOK_URL }}" ] && curl -s -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Deployed \`${{ github.repository }}\` @ \`${{ github.event.workflow_run.head_sha }}\`\"}" || true

      - name: Notify failure
        if: failure()
        run: |
          [ -n "${{ secrets.WEBHOOK_URL }}" ] && curl -s -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Deployment failed for \`${{ github.repository }}\` @ \`${{ github.event.workflow_run.head_sha }}\`\"}" || true
