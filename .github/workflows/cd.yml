name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in Helm values
        run: |
          sed -i "s/tag: .*/tag: ${{ github.event.workflow_run.head_sha }}/g" \
            helm/365-days-of-art/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/365-days-of-art/values.yaml
          if ! git diff --staged --quiet; then
            git commit -m "chore: deploy ${{ github.event.workflow_run.head_sha }} [skip ci]"
            git push
          fi

      - name: Notify success
        if: success()
        run: |
          [ -n "${{ secrets.WEBHOOK_URL }}" ] && curl -s -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Deployed \`${{ github.repository }}\` @ \`${{ github.event.workflow_run.head_sha }}\`\"}" || true

      - name: Notify failure
        if: failure()
        run: |
          [ -n "${{ secrets.WEBHOOK_URL }}" ] && curl -s -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Deployment failed for \`${{ github.repository }}\` @ \`${{ github.event.workflow_run.head_sha }}\`\"}" || true
