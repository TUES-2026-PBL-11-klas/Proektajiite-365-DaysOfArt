# Local development orchestration for 365 Days of Art.
#
#   docker compose up --build
#
# Backend  -> http://localhost:5001  (container port 5000)
# Frontend -> http://localhost:3000
#
# The database is the remote Supabase instance configured in backend/.env
# (DATABASE_URL). Redis runs as a local service for background jobs.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Override so the app reaches the compose-network Redis, not localhost.
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
    ports:
      - "5001:5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side calls go to the host-exposed backend port.
        NEXT_PUBLIC_API_URL: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - backend
