apiVersion: batch/v1
kind: CronJob
metadata:
  name: select-daily-prompts
  namespace: days-of-art
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: select-daily-prompts
              image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
              imagePullPolicy: Always
              workingDir: /app
              command: ["flask", "--app", "run.py", "select-daily-prompts"]
              envFrom:
                - configMapRef:
                    name: backend-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets
                      key: database-url
                - name: JWT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets
                      key: jwt-secret-key
---
apiVersion: batch/v1
